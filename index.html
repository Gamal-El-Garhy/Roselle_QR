<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Roselle</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="bg-deco"></div>

  <div class="brand">
    <div class="logo-circle">
      <img src="Logo/Roselle.jpeg" alt="Roselle Logo">

  </div>

  <div class="sheet">

    <h2>اختار من هنا</h2>

    <div class="link-list">

      <a class="link-item" href="https://www.instagram.com/roselle.eg1?igsh=MTlldHlldTM3MWFiNQ==" target="_blank" rel="noopener">
        <div class="icon ig"><img src="Logo/insta.png" alt="Instagram Logo"></div>
        <span>انستجرام</span>
        <span class="arrow">›</span>
      </a>

      <a class="link-item" href="https://www.tiktok.com/@roselle.eg1?_r=1&_t=ZS-98to8g7engr" target="_blank" rel="noopener">

        <span>تيك توك</span>
        <span class="arrow">›</span>
      </a>

      <a class="link-item" href="https://ipn.eg/S/roselle/instapay/1O532k" target="_blank" rel="noopener">
        <div class="icon ip"><img src="Logo/instapay.png" alt="InstaPay Logo"></div>
        <span>الدفع عبر InstaPay</span>
        <span class="arrow">›</span>
      </a>

    </div>

    <div class="footer-note">Roselle © 2026</div>
